[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipynb-local-viewer"
version = "0.1.0"
description = "A smooth local reader for saved Jupyter notebooks with lazy media output streaming."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Masoud KA", email = "pypi@masoudka.com" },
]
maintainers = [
    { name = "masoudka", email = "pypi@masoudka.com" },
]
keywords = ["jupyter", "notebook", "viewer", "flask", "ipynb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "flask>=3.0",
    "Markdown>=3.6",
    "bleach[css]>=6.1",
    "Pillow>=10",
    "Pygments>=2.17",
]

[project.optional-dependencies]
demo = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "IPython>=8",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "Pillow>=10",
    "seaborn>=0.13",
    "plotly>=5.20",
]

[project.urls]
Homepage = "https://github.com/msdkhairi/ipynb-viewer"
Repository = "https://github.com/msdkhairi/ipynb-viewer"
Issues = "https://github.com/msdkhairi/ipynb-viewer/issues"
Changelog = "https://github.com/msdkhairi/ipynb-viewer/blob/main/CHANGELOG.md"

[project.scripts]
notebook-viewer = "ipynb_viewer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipynb_viewer = ["templates/*.html", "static/*.css", "static/*.js", "demo_notebooks/*.ipynb", "demo_notebooks/assets/*"]
